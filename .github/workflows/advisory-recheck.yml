# 依赖风险复查（审计2 #6 的「有期限」载体）
#
# deny.toml 里每条 advisory ignore 都写了「为何不能修 / 为何可接受 / 何时复查 + 期限」。
# 本 workflow 是那条期限的自动心跳：每周跑一次 `cargo deny check advisories`——
#   绿 = 已知风险集合未变（ignores 仍然恰好覆盖全部 advisory，没有新东西混进来）；
#   红 = 出现了**新的**未评估 advisory（或 ignore 条目失效/引用了不存在的 id）——
#         这是一次必须处理的告警，不是背景噪声。
# 同时把 deny.toml 的 ignore 清单原样打印进 run 页面，复查人一眼看到每条期限与理由。
# 期限临近（deny.toml 里的 2027-02-01）而未处理时，由人工在 red run 里裁决。
#
# 刻意用 cron 而非 push 触发：push 上的告警会淹没在开发噪声里；这里要的是
# 「每周一次、红就是事」的节奏。
name: Advisory Recheck

on:
  schedule:
    # 周一 04:17 UTC（避开整点；GitHub schedule 有排队抖动，实际时间不保证）
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  recheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 分支头（该仓库不发 semver tag）
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with: { tool: "cargo-deny" }
      - name: Print current ignore commitments (期限与理由)
        run: |
          echo "### deny.toml 当前接受的风险（含期限）" >> "$GITHUB_STEP_SUMMARY"
          awk '/^ignore = \[/,/^\]/' deny.toml | grep -E 'id =|期限|【' >> "$GITHUB_STEP_SUMMARY" || true
      - name: cargo deny check advisories
        run: cargo deny check advisories
