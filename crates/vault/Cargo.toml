[package]
name = "fs_vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
rand = "0.8"
thiserror.workspace = true
keyring.workspace = true

# 仅用于 `pid_is_alive` 的 `kill(pid, 0)`。std 不暴露任何判活手段，而没有判活就没有陈旧锁回收：
# 被 SIGKILL / 掉电留下的 vault.lock 会把用户永久挡在自己的保险库外（见 store.rs 的 P0 注记）。
# libc 早已在本工作区的依赖图里（keyring / tokio 等间接引入），此处只是把它提为直接依赖，
# 不新增任何 crate 节点；且限定 cfg(unix)，Windows 侧仍走内核级独占句柄、不需要它。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
keyring-core = "1.0"
